<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- 1. The Meta Refresh handles the instant redirect -->
    <meta http-equiv="refresh" content="0; url=https://scholar.google.com/citations?user=VPYNYEoAAAAJ&hl=en">
    
    <!-- 2. Tells search engines where the actual content lives -->
    <link rel="canonical" href="https://scholar.google.com/citations?user=VPYNYEoAAAAJ&hl=en">
    
    <title>Redirecting...</title>
    
    <!-- 3. JavaScript fallback if the browser blocks meta refreshes -->
    <script type="text/javascript">
        window.location.href = https://scholar.google.com/citations?user=VPYNYEoAAAAJ&hl=en";
    </script>
</head>
<body>
    <!-- 4. Manual link for users if all else fails -->
    <p> My website is under maintenance! You are being redirected to my google scholars page. 
       If you are not redirected automatically, <a href="https://scholar.google.com/citations?user=VPYNYEoAAAAJ&hl=en">click here</a>.
    </p>
</body>
</html>
